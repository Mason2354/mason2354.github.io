<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> MASON MAX</title>
    <!-- Google Fonts for sleek typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b0d17;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            overflow-x: hidden;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 40px 70px, #38bdf8, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 90px 40px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 160px 120px, #f43f5e, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 200px 200px;
        }

        /* Top Navigation Header */
        header {
            width: 100%;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        nav {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            justify-content: center;
            gap: 2rem;
            padding: 1rem;
        }

        nav a {
            color: #94a3b8;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            padding: 0.5rem 1rem;
            border-radius: 6px;
        }

        nav a:hover, nav a.active {
            color: #ffffff;
            background: rgba(56, 189, 248, 0.15);
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
        }

        /* Main Glassmorphism Card Container */
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            width: 100%;
            max-width: 800px;
        }

        .glass-card {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.125);
            border-radius: 20px;
            padding: 2.5rem;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5),
                        0 0 30px rgba(56, 189, 248, 0.1);
            width: 100%;
        }

        /* Title Banner */
        .title-section {
            text-align: center;
            margin-bottom: 2rem;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #ffffff 0%, #38bdf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
        }

        .stardate {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            color: #38bdf8;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        /* Content Layout */
        h2 {
            font-size: 1.5rem;
            color: #f8fafc;
            margin-bottom: 1.5rem;
        }

        .about-content {
            display: flex;
            gap: 2rem;
            align-items: flex-start;
        }

        .profile-img {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #38bdf8;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
            flex-shrink: 0;
        }

        .bio-text {
            line-height: 1.7;
            color: #cbd5e1;
            font-size: 0.95rem;
        }

        .bio-text p {
            margin-bottom: 1rem;
        }

        .bio-text a {
            color: #38bdf8;
            text-decoration: none;
            border-bottom: 1px dashed #38bdf8;
            transition: color 0.2s ease;
        }

        .bio-text a:hover {
            color: #7dd3fc;
            border-bottom-style: solid;
        }

        /* Footer Links */
        footer {
            width: 100%;
            text-align: center;
            padding: 2rem 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }

        .social-links {
            display: flex;
            gap: 1.5rem;
        }

        .social-links a {
            color: #94a3b8;
            font-size: 1.2rem;
            text-decoration: none;
            transition: color 0.2s ease, transform 0.2s ease;
        }

        .social-links a:hover {
            color: #38bdf8;
            transform: translateY(-2px);
        }

        .badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.75rem;
            color: #64748b;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Floating Space Elements */
        .rocket {
            position: absolute;
            font-size: 1.5rem;
            animation: float 6s ease-in-out infinite;
        }

        .rocket-1 { top: 20%; right: 10%; animation-delay: 0s; }
        .rocket-2 { bottom: 15%; left: 8%; animation-delay: 3s; }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(5deg); }
        }

        /* Responsive Mobile Layout */
        @media (max-width: 640px) {
            .about-content {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }
            nav {
                gap: 0.5rem;
            }
            h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>

    <!-- Floating Rockets -->
    <div class="rocket rocket-1">🚀</div>
    <div class="rocket rocket-2">🚀</div>

    <!-- Navigation Header -->
    <header>
        <nav>
            <a href="#home" class="active">HOME</a>
            <a href="#about">ABOUT</a>
            <a href="#projects">PROJECTS</a>
            <a href="#contact">CONTACT</a>
        </nav>
    </header>

    <!-- Main Card Content -->
    <main>
        <div class="glass-card">
            
            <div class="title-section">
                <h1>MASON SITE</h1>
                <div class="stardate">STARDATE: <span id="year"></span> (WELCOME BACK!)</div>
            </div>

            <h2>About me...</h2>

            <div class="about-content">
                <!-- Replace 'https://via.placeholder.com/150' with your own image URL -->
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=300&q=80" alt="Michal Profile" class="profile-img">
                
                <div class="bio-text">
                    <p>
                        !
                    </p>
                    <p>
                        MM
                    </p>
                    <p>
                        .....
                    </p>
                </div>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="social-links">
            <a href="#" title="GitHub">💻</a>
            <a href="#" title="Twitter">🐤</a>
            <a href="#" title="YouTube">🎥</a>
            <a href="#" title="Instagram">📷</a>
        </div>
        <div class="badge">C</div>
    </footer>

    <script>
        // Automatically keep the current year updated
        document.getElementById("year").innerText = new Date().getFullYear();
    </script>

</body>
</html>
